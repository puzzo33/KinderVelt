# KV-FOS: automatic monthly close (SPEC §5 steps 2-3).
# When the Treasurer pushes input documents for a month, this workflow
# runs the (idempotent) close for every affected month and commits the
# derived data + reports back to the same branch. Gaps show up in the
# committed GAPS.md; re-uploading corrected files re-triggers this and
# reprocesses without duplicates.
name: KV-FOS process month

on:
  push:
    paths:
      - "kv-fos/months/**/inputs/**"
      - "kv-fos/knowledge/**"
  workflow_dispatch:
    inputs:
      month:
        description: "Month to close (YYYY-MM)"
        required: true

permissions:
  contents: write

concurrency:
  group: kvfos-process-${{ github.ref }}
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: kv-fos
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r kv-fos/requirements.txt

      - name: Determine affected months
        id: months
        run: |
          if [ -n "${{ github.event.inputs.month }}" ]; then
            echo "list=${{ github.event.inputs.month }}" >> "$GITHUB_OUTPUT"
          else
            months=$(git diff --name-only HEAD^ HEAD -- 'kv-fos/months/*/inputs/**' \
              | sed -E 's#kv-fos/months/([0-9]{4}-[0-9]{2})/.*#\1#' | sort -u | tr '\n' ' ')
            echo "list=$months" >> "$GITHUB_OUTPUT"
          fi

      - name: Run monthly close
        if: steps.months.outputs.list != ''
        run: |
          set -e
          for m in ${{ steps.months.outputs.list }}; do
            echo "::group::close $m"
            # approved months are never silently re-closed (SPEC §9.8);
            # the CLI refuses and the treasurer must run --amend manually
            python -m kvfos --root kv-fos close --month "$m" || true
            echo "::endgroup::"
          done

      - name: Commit reports back
        if: steps.months.outputs.list != ''
        run: |
          git config user.name "kv-fos-bot"
          git config user.email "kv-fos-bot@users.noreply.github.com"
          git add kv-fos/months kv-fos/registry
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "KV-FOS: monthly close for ${{ steps.months.outputs.list }} [skip ci]"
            git push
          fi
