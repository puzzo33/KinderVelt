# KV-FOS: automatic monthly close (SPEC §5 steps 2-3).
# Runs when documents, portal actions (uploads, accepts, approve
# requests), or knowledge-base edits land on the branch. The close is
# idempotent, so reprocessing after any change is always safe. Reports,
# derived data and the regenerated Treasurer Console are committed back.
name: KV-FOS process month

on:
  push:
    paths:
      - "kv-fos/months/**"
      - "kv-fos/knowledge/**"
  workflow_dispatch:
    inputs:
      month:
        description: "Month to close (YYYY-MM)"
        required: true

permissions:
  contents: write

concurrency:
  group: kvfos-process-${{ github.ref }}
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: kv-fos
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r kv-fos/requirements.txt

      - name: Determine affected months
        id: months
        run: |
          if [ -n "${{ github.event.inputs.month }}" ]; then
            echo "list=${{ github.event.inputs.month }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          months=$(git diff --name-only HEAD^ HEAD -- 'kv-fos/months/**' \
            | sed -nE 's#kv-fos/months/([0-9]{4}-[0-9]{2})/.*#\1#p' | sort -u)
          if [ -z "$months" ]; then
            # knowledge-base change: reprocess every unapproved month so
            # new vendors/resolutions take effect everywhere
            months=$(for d in kv-fos/months/*/; do
              m=$(basename "$d")
              [ -f "$d/approved.lock.json" ] || echo "$m"
            done)
          fi
          echo "list=$(echo $months | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Run monthly close
        if: steps.months.outputs.list != ''
        run: |
          set -e
          for m in ${{ steps.months.outputs.list }}; do
            echo "::group::close $m"
            # approved months re-close as amendments (SPEC §9.8) so a
            # portal "Request a change" produces AMENDMENT.md, never a
            # silent rewrite
            if [ -f "kv-fos/months/$m/approved.lock.json" ]; then
              python -m kvfos --root kv-fos close --month "$m" --amend || true
            else
              python -m kvfos --root kv-fos close --month "$m" || true
            fi
            # portal approve request: approve only succeeds with a clean
            # close (no blocking gaps); the marker is consumed either way
            marker="kv-fos/months/$m/APPROVE_REQUESTED.txt"
            if [ -f "$marker" ]; then
              if python -m kvfos --root kv-fos approve --month "$m"; then
                rm "$marker"
              else
                echo "approval refused for $m — see GAPS.md" > "$marker"
              fi
            fi
            echo "::endgroup::"
          done
          python -m kvfos --root kv-fos dashboard

      - name: Commit reports back
        if: steps.months.outputs.list != ''
        run: |
          git config user.name "kv-fos-bot"
          git config user.email "kv-fos-bot@users.noreply.github.com"
          git add kv-fos/months kv-fos/registry kv-fos/dashboard
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "KV-FOS: monthly close for ${{ steps.months.outputs.list }} [skip ci]"
            git push
          fi
